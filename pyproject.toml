[project]
name = "tahoe-pseudobulk"
version = "0.1.0"
description = "Tahoe-100M pseudobulk preprocessing and export utilities"
readme = "project_proposal.txt"
requires-python = ">=3.10"
dependencies = [
  "anndata",
  "datasets",
  "h5py",
  "ipykernel>=7.2.0",
  "lightning",
  "numpy",
  "pandas",
  "pyarrow",
  "rdkit",
  "requests",
  "scikit-learn",
  "scipy",
  "seaborn",
  "torch",
  "torchinfo>=1.8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "tahoe_pseudobulk",
  "tahoe_gene_filters",
  "pseudobulk_tahoe100",
  "load_cell_line_collection",
]
