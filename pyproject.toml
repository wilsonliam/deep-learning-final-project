[project]
name = "tahoe-pseudobulk"
version = "0.1.0"
description = "Tahoe-100M pseudobulk preprocessing and export utilities"
readme = "project_proposal.txt"
requires-python = ">=3.10"
dependencies = [
  "anndata",
  "datasets",
  "h5py",
  "numpy",
  "pandas",
  "pyarrow",
  "requests",
  "scipy",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
